name: Refresh land listings

on:
  schedule:
    - cron: "17 11 * * *"   # ~6:17am ET
    - cron: "17 23 * * *"   # ~6:17pm ET
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated sources to run (blank = all)"
        required: false
        default: ""
      test_alert:
        description: "Send a test push notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache geocoder data
        uses: actions/cache@v4
        with:
          path: cache/geo
          key: gazetteer-2024

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Test push
        if: ${{ github.event.inputs.test_alert == 'true' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "NTFY_TOPIC secret is not set"; exit 1; fi
          curl -s -H "Title: Land feed connected" -H "Tags: world_map" -H "Click: https://dfirouz.github.io/land-feed/" \
            -d "You'll get alerts here for new public land listings, price changes and removals." "https://ntfy.sh/$NTFY_TOPIC"
          echo; echo "topic length: ${#NTFY_TOPIC}"
          [ "$NTFY_TOPIC" = "dean-land-7f3k9q2x" ] && echo "topic matches app subscription" || echo "topic DOES NOT match app subscription"
          echo "messages on topic in last hour:"; curl -s "https://ntfy.sh/$NTFY_TOPIC/json?poll=1&since=1h" | wc -l

      - name: Scrape, diff, alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m scraper.run --only "${{ github.event.inputs.only }}"

      - name: Debug summary
        if: always()
        run: python -m scraper.debug_summary || true

      - name: Upload debug captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "land-feed bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
